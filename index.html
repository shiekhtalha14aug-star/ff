<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Battle Arena 3D</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    font-family:Arial, sans-serif;
    background:#050505;
}

/* =========================
   LOBBY
========================= */

#lobby{

    position:fixed;
    inset:0;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    background:
    radial-gradient(circle at center,
    #263b55,
    #070b12 70%);

    color:white;

    z-index:100;
}

#lobby h1{

    font-size:65px;

    letter-spacing:5px;

    text-shadow:
    0 0 10px #00d9ff,
    0 0 30px #0077ff;

    margin-bottom:10px;
}

#lobby p{

    color:#b9c7d6;

    font-size:18px;

    margin-bottom:40px;
}

.startButton{

    border:2px solid #00d9ff;

    background:
    linear-gradient(
        90deg,
        #0077ff,
        #00d9ff
    );

    color:white;

    font-size:25px;

    font-weight:bold;

    padding:18px 65px;

    border-radius:8px;

    cursor:pointer;

    box-shadow:
    0 0 20px #008cff;

    transition:.2s;
}

.startButton:hover{

    transform:scale(1.08);

    box-shadow:
    0 0 40px #00d9ff;
}


/* =========================
   GAME UI
========================= */

#gameUI{

    position:fixed;

    inset:0;

    pointer-events:none;

    z-index:20;

    display:none;
}


/* HEALTH */

#healthBox{

    position:absolute;

    left:25px;
    bottom:25px;

    width:260px;

    background:#111b;

    border:2px solid #ffffff55;

    padding:10px;

    border-radius:8px;
}

#healthText{

    color:white;

    margin-bottom:6px;

    font-weight:bold;
}

#healthBar{

    width:100%;
    height:18px;

    background:#333;

    border-radius:5px;

    overflow:hidden;
}

#healthFill{

    width:100%;
    height:100%;

    background:#23e56b;

    transition:.2s;
}


/* AMMO */

#ammo{

    position:absolute;

    right:30px;
    bottom:25px;

    color:white;

    font-size:28px;

    font-weight:bold;

    text-shadow:0 2px 5px black;
}


/* COINS */

#coins{

    position:absolute;

    right:30px;
    top:25px;

    color:#ffd83d;

    font-size:24px;

    font-weight:bold;
}


/* SCORE */

#score{

    position:absolute;

    left:50%;

    transform:translateX(-50%);

    top:20px;

    color:white;

    font-size:20px;

}


/* CROSSHAIR */

#crosshair{

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:22px;
    height:22px;
}

#crosshair::before,
#crosshair::after{

    content:"";

    position:absolute;

    background:white;

    box-shadow:0 0 5px black;
}

#crosshair::before{

    width:22px;
    height:2px;

    top:10px;
    left:0;
}

#crosshair::after{

    height:22px;
    width:2px;

    left:10px;
    top:0;
}


/* =========================
   VENDING MACHINE
========================= */

#shop{

    display:none;

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:430px;

    background:#101820;

    border:2px solid #00d9ff;

    border-radius:15px;

    padding:25px;

    color:white;

    pointer-events:auto;

    box-shadow:
    0 0 40px #0077ff88;
}

#shop h2{

    text-align:center;

    color:#00d9ff;

    margin-bottom:20px;
}

.weapon{

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:15px;

    margin:10px 0;

    background:#1b2935;

    border-radius:8px;
}

.weapon button{

    border:none;

    background:#00aaff;

    color:white;

    padding:9px 15px;

    border-radius:5px;

    cursor:pointer;
}

.closeShop{

    width:100%;

    margin-top:15px;

    padding:10px;

    background:#333;

    color:white;

    border:none;

    border-radius:5px;

    cursor:pointer;
}


/* =========================
   MESSAGE
========================= */

#message{

    position:absolute;

    left:50%;
    top:70%;

    transform:translateX(-50%);

    color:white;

    font-size:20px;

    text-shadow:0 2px 5px black;

    opacity:0;

    transition:.3s;
}


/* =========================
   GAME OVER
========================= */

#gameOver{

    display:none;

    position:fixed;

    inset:0;

    z-index:200;

    background:#000c;

    color:white;

    justify-content:center;

    align-items:center;

    flex-direction:column;
}

#gameOver h1{

    font-size:60px;

    color:#ff4040;
}

#gameOver button{

    margin-top:25px;

    padding:15px 40px;

    font-size:20px;

    cursor:pointer;
}


/* MOBILE */

@media(max-width:700px){

    #lobby h1{
        font-size:38px;
    }

    #shop{
        width:90%;
    }

    #ammo{
        font-size:20px;
    }

}

</style>

</head>


<body>


<!-- =========================
     LOBBY
========================= -->

<div id="lobby">

    <h1>BATTLE ARENA</h1>

    <p>
        3D Survival Combat
    </p>

    <button
        class="startButton"
        onclick="startGame()">

        ▶ START GAME

    </button>

</div>



<!-- =========================
     GAME UI
========================= -->

<div id="gameUI">

    <div id="score">
        ENEMIES: 0
    </div>

    <div id="coins">
        💰 500
    </div>

    <div id="crosshair"></div>

    <div id="ammo">
        🔫 30 / 30
    </div>

    <div id="healthBox">

        <div id="healthText">
            ❤️ HEALTH 100
        </div>

        <div id="healthBar">

            <div id="healthFill"></div>

        </div>

    </div>

    <div id="message"></div>

</div>



<!-- =========================
     VENDING MACHINE
========================= -->

<div id="shop">

    <h2>🏪 VENDING MACHINE</h2>

    <div class="weapon">

        <span>
            🔫 Pistol
        </span>

        <button onclick="buyWeapon('pistol')">
            FREE
        </button>

    </div>


    <div class="weapon">

        <span>
            ⚡ SMG
            <small> - 250 coins</small>
        </span>

        <button onclick="buyWeapon('smg')">
            BUY
        </button>

    </div>


    <div class="weapon">

        <span>
            💥 Shotgun
            <small> - 400 coins</small>
        </span>

        <button onclick="buyWeapon('shotgun')">
            BUY
        </button>

    </div>


    <button
        class="closeShop"
        onclick="closeShop()">

        CLOSE

    </button>

</div>



<!-- =========================
     GAME OVER
========================= -->

<div id="gameOver">

    <h1>GAME OVER</h1>

    <p id="finalScore">
        Score: 0
    </p>

    <button onclick="location.reload()">
        PLAY AGAIN
    </button>

</div>



<!-- THREE.JS -->

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/PointerLockControls.js"></script>


<script>


/* =========================
   VARIABLES
========================= */

let scene;
let camera;
let renderer;

let controls;

let player;

let enemies = [];

let bullets = [];

let clock;

let health = 100;

let coins = 500;

let kills = 0;

let ammo = 30;

let weapon = "pistol";

let gameRunning = false;

let canShoot = true;


/* =========================
   START GAME
========================= */

function startGame(){

    document
    .getElementById("lobby")
    .style.display="none";

    document
    .getElementById("gameUI")
    .style.display="block";

    initGame();

}


/* =========================
   INITIALIZE
========================= */

function initGame(){

    scene = new THREE.Scene();

    scene.background =
    new THREE.Color(0x87a8b8);


    /* CAMERA */

    camera = new THREE.PerspectiveCamera(

        70,

        window.innerWidth /
        window.innerHeight,

        0.1,

        1000

    );

    camera.position.set(
        0,
        2,
        8
    );


    /* RENDERER */

    renderer =
    new THREE.WebGLRenderer({

        antialias:true

    });

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.shadowMap.enabled=true;

    document.body.appendChild(
        renderer.domElement
    );


    /* LIGHT */

    const ambient =
    new THREE.AmbientLight(
        0xffffff,
        1
    );

    scene.add(ambient);


    const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

    sun.position.set(
        20,
        40,
        20
    );

    sun.castShadow=true;

    scene.add(sun);


    /* GROUND */

    const groundGeometry =
    new THREE.PlaneGeometry(
        200,
        200
    );

    const groundMaterial =
    new THREE.MeshStandardMaterial({

        color:0x4c693f

    });

    const ground =
    new THREE.Mesh(
        groundGeometry,
        groundMaterial
    );

    ground.rotation.x =
    -Math.PI/2;

    ground.receiveShadow=true;

    scene.add(ground);


    /* PLAYER */

    player =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            1,
            2,
            1
        ),

        new THREE.MeshStandardMaterial({
            color:0x2196f3
        })

    );

    player.position.set(
        0,
        1,
        8
    );

    player.visible=false;

    scene.add(player);


    /* ARENA */

    createArena();


    /* VENDING MACHINE */

    createVendingMachine();


    /* ENEMIES */

    for(let i=0;i<6;i++){

        createEnemy();

    }


    /* CLOCK */

    clock = new THREE.Clock();


    /* CONTROLS */

    controls =
    new THREE.PointerLockControls(
        camera,
        document.body
    );

    document.body.addEventListener(
        "click",
        function(){

            if(gameRunning &&
               !document
               .getElementById("shop")
               .style.display){

                controls.lock();

            }

        }
    );


    gameRunning=true;


    animate();

}


/* =========================
   ARENA
========================= */

function createArena(){

    for(let i=0;i<18;i++){

        const geometry =
        new THREE.BoxGeometry(
            3,
            3,
            3
        );

        const material =
        new THREE.MeshStandardMaterial({

            color:
            Math.random() > .5
            ? 0x555555
            : 0x263238

        });

        const building =
        new THREE.Mesh(
            geometry,
            material
        );

        building.position.set(

            (Math.random()-.5)*70,

            1.5,

            (Math.random()-.5)*70

        );

        building.castShadow=true;

        building.receiveShadow=true;

        scene.add(building);

    }


    /* TREES */

    for(let i=0;i<20;i++){

        createTree();

    }

}


/* =========================
   TREE
========================= */

function createTree(){

    const trunk =
    new THREE.Mesh(

        new THREE.CylinderGeometry(
            .3,
            .45,
            3,
            8
        ),

        new THREE.MeshStandardMaterial({
            color:0x704214
        })

    );

    const leaves =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            1.7,
            10,
            10
        ),

        new THREE.MeshStandardMaterial({
            color:0x16821f
        })

    );

    const x =
    (Math.random()-.5)*100;

    const z =
    (Math.random()-.5)*100;


    trunk.position.set(
        x,
        1.5,
        z
    );

    leaves.position.set(
        x,
        4,
        z
    );

    scene.add(trunk);

    scene.add(leaves);

}


/* =========================
   VENDING MACHINE
========================= */

function createVendingMachine(){

    const body =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            2,
            3,
            1
        ),

        new THREE.MeshStandardMaterial({
            color:0x0b6e9e
        })

    );

    body.position.set(
        5,
        1.5,
        5
    );

    scene.add(body);


    const screen =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            1.3,
            .7,
            .1
        ),

        new THREE.MeshStandardMaterial({
            color:0x00ffff,
            emissive:0x0088aa
        })

    );

    screen.position.set(
        5,
        2,
        4.45
    );

    scene.add(screen);

}


/* =========================
   ENEMY
========================= */

function createEnemy(){

    const enemy =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            1,
            2,
            1
        ),

        new THREE.MeshStandardMaterial({
            color:0xff3030
        })

    );

    enemy.position.set(

        (Math.random()-.5)*60,

        1,

        (Math.random()-.5)*60

    );

    enemy.userData.health=100;

    enemy.userData.speed =
    .7 + Math.random()*.5;

    scene.add(enemy);

    enemies.push(enemy);

}


/* =========================
   SHOOT
========================= */

document.addEventListener(
"mousedown",
function(){

    if(!gameRunning)
        return;

    shoot();

});


function shoot(){

    if(!canShoot)
        return;

    if(ammo<=0){

        showMessage(
            "NO AMMO!"
        );

        return;

    }


    ammo--;

    updateUI();


    canShoot=false;


    setTimeout(
        ()=>{
            canShoot=true;
        },
        weapon==="smg"
        ?100
        :weapon==="shotgun"
        ?700
        :400
    );


    const raycaster =
    new THREE.Raycaster();


    raycaster.setFromCamera(

        new THREE.Vector2(0,0),

        camera

    );


    const hits =
    raycaster.intersectObjects(
        enemies
    );


    if(hits.length>0){

        const enemy =
        hits[0].object;

        let damage=25;


        if(weapon==="smg")
            damage=15;

        if(weapon==="shotgun")
            damage=60;


        enemy.userData.health -=
        damage;


        if(enemy.userData.health<=0){

            scene.remove(enemy);

            enemies =
            enemies.filter(
                e=>e!==enemy
            );

            kills++;

            coins+=100;

            updateUI();


            setTimeout(
                createEnemy,
                1000
            );

        }

    }

}


/* =========================
   ENEMY AI
========================= */

function updateEnemies(delta){

    enemies.forEach(enemy=>{

        const distance =
        enemy.position.distanceTo(
            camera.position
        );


        if(distance>3){

            const direction =
            new THREE.Vector3();

            direction
            .subVectors(
                camera.position,
                enemy.position
            )
            .normalize();


            enemy.position.add(

                direction.multiplyScalar(
                    enemy.userData.speed *
                    delta
                )

            );

        }

        else{

            health -=
            10 * delta;

            updateUI();


            if(health<=0){

                endGame();

            }

        }

    });

}


/* =========================
   BUY WEAPON
========================= */

function buyWeapon(type){

    if(type==="pistol"){

        weapon="pistol";

        showMessage(
            "PISTOL EQUIPPED!"
        );

        closeShop();

        return;

    }


    if(type==="smg"){

        if(coins>=250){

            coins-=250;

            weapon="smg";

            showMessage(
                "SMG PURCHASED!"
            );

            closeShop();

        }

        else{

            showMessage(
                "NOT ENOUGH COINS!"
            );

        }

    }


    if(type==="shotgun"){

        if(coins>=400){

            coins-=400;

            weapon="shotgun";

            showMessage(
                "SHOTGUN PURCHASED!"
            );

            closeShop();

        }

        else{

            showMessage(
                "NOT ENOUGH COINS!"
            );

        }

    }

}


/* =========================
   SHOP OPEN
========================= */

document.addEventListener(
"keydown",
function(e){

    if(e.key.toLowerCase()==="e"){

        const distance =
        camera.position.distanceTo(
            new THREE.Vector3(
                5,
                1.5,
                5
            )
        );


        if(distance<5){

            document
            .getElementById("shop")
            .style.display="block";

            if(controls)
                controls.unlock();

        }

    }

});


function closeShop(){

    document
    .getElementById("shop")
    .style.display="none";

}


/* =========================
   UI
========================= */

function updateUI(){

    document.getElementById(
        "healthText"
    ).innerText =
    "❤️ HEALTH " +
    Math.max(
        0,
        Math.floor(health)
    );


    document.getElementById(
        "healthFill"
    ).style.width =
    Math.max(
        0,
        health
    ) + "%";


    document.getElementById(
        "coins"
    ).innerText =
    "💰 " + Math.floor(coins);


    document.getElementById(
        "ammo"
    ).innerText =
    "🔫 " + ammo + " / 30";


    document.getElementById(
        "score"
    ).innerText =
    "ENEMIES DEFEATED: " +
    kills;

}


/* =========================
   MESSAGE
========================= */

function showMessage(text){

    const msg =
    document.getElementById(
        "message"
    );

    msg.innerText=text;

    msg.style.opacity=1;

    setTimeout(
        ()=>{
            msg.style.opacity=0;
        },
        1500
    );

}


/* =========================
   GAME OVER
========================= */

function endGame(){

    gameRunning=false;

    if(controls)
        controls.unlock();

    document
    .getElementById("gameOver")
    .style.display="flex";

    document
    .getElementById("finalScore")
    .innerText=
    "Enemies defeated: " +
    kills;

}


/* =========================
   MOVEMENT
========================= */

const keys={};

document.addEventListener(
"keydown",
e=>{
    keys[e.key.toLowerCase()]=true;
});

document.addEventListener(
"keyup",
e=>{
    keys[e.key.toLowerCase()]=false;
});


function movement(delta){

    if(!controls ||
       !controls.isLocked)
       return;


    const speed =
    8 * delta;


    if(keys["w"])
        controls.moveForward(speed);

    if(keys["s"])
        controls.moveForward(-speed);

    if(keys["a"])
        controls.moveRight(-speed);

    if(keys["d"])
        controls.moveRight(speed);


    camera.position.y=2;

}


/* =========================
   ANIMATION
========================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    if(!gameRunning){

        renderer.render(
            scene,
            camera
        );

        return;

    }


    const delta =
    Math.min(
        clock.getDelta(),
        .05
    );


    movement(delta);

    updateEnemies(delta);

    renderer.render(
        scene,
        camera
    );

}


/* =========================
   RESIZE
========================= */

window.addEventListener(
"resize",
function(){

    if(!camera || !renderer)
        return;

    camera.aspect =
    window.innerWidth /
    window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

});


</script>

</body>
</html>
